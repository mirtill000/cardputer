; PlatformIO Project Configuration File
;
; Firmware:  Cardputer NetAudit — network discovery/auditing tool with a
;            cyberpunk/Matrix UI, for the M5Stack Cardputer / Cardputer ADV
;            (ESP32-S3FN8: no PSRAM, 8 MB flash).
;
; Board choice: PlatformIO has no dedicated board JSON for "Cardputer ADV"
; yet. Both the original Cardputer and the ADV are built around an
; M5Stamp-S3(A) module, so we target the closest official definition
; (m5stack-stamps3, same MCU/flash) and let M5Unified's runtime board
; auto-detection (M5.begin()) pick the correct display driver, keyboard
; matrix and IR/speaker pins for the exact unit at boot. See README.md,
; section "Scelte tecniche", for the full rationale and the fallback plan
; if a future M5Unified release still mis-detects the ADV.

[platformio]
default_envs = cardputer-adv

[env]
platform = espressif32 @ ^6.9.0
framework = arduino
board = m5stack-stamps3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 1500000
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    m5stack/M5GFX @ ^0.2.4
    m5stack/M5Cardputer @ ^1.0.2
    bblanchon/ArduinoJson @ ^7.2.1

[env:cardputer-adv]
build_flags =
    ${env.build_flags}
    -DBOARD_CARDPUTER_ADV=1

; Original (non-ADV) Cardputer, kept for compatibility since both units
; share the same MCU/flash and most of the module logic is board-agnostic.
[env:cardputer]
build_flags =
    ${env.build_flags}
    -DBOARD_CARDPUTER=1

; Host-side unit tests for pure logic that does not touch ESP32 hardware
; (subnet/IP math, OUI table parsing, device-classification heuristics,
; default-credentials dictionary parsing). Runs via PlatformIO's "native"
; platform + Unity on the host gcc/g++ toolchain, so it works even in
; sandboxes that cannot reach the espressif32 toolchain registry.
[env:native]
platform = native
build_flags =
    -std=c++17
    -DUNIT_TEST
    -Isrc
test_framework = unity
test_filter = native_*
